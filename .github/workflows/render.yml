name: Render CachyPromo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render CachyPromo out/CachyPromo.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CachyPromo
          path: out/CachyPromo.mp4
