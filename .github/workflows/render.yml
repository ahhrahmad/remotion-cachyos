name: Render CachyOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      composition:
        description: Composition to render
        type: choice
        options:
          - CachyLaunch
          - CachyLaunchVertical
          - WezTermStory
        default: CachyLaunch

concurrency:
  group: render-${{ github.event.inputs.composition || 'CachyLaunch' }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSITION: ${{ github.event.inputs.composition || 'CachyLaunch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 libpango-1.0-0 libcairo2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render "$COMPOSITION" "out/$COMPOSITION.mp4" --codec=h264 --crf=18 --pixel-format=yuv420p --audio-codec=aac --audio-bitrate=192k

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPOSITION }}
          path: out/${{ env.COMPOSITION }}.mp4
          retention-days: 14
